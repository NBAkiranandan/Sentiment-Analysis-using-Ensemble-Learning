version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiment_backend
    ports:
      - "8000:8000"
    environment:
      - DATASET_SAMPLE_SIZE=50000
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentiment_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
